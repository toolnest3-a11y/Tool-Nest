<script>

// HTML Minifier
function minifyHTML(code) {
  let result = code;

  if (removeComments.checked) {
    if (preserveImportant.checked) {
      result = result.replace(/<!--!(.*?)-->/gs, '<!--!$1-->');
      result = result.replace(/<!--(?!\!)[\s\S]*?-->/g, '');
    } else {
      result = result.replace(/<!--[\s\S]*?-->/g, '');
    }
  }

  if (removeWhitespace.checked) {
    result = result.replace(/>\s+</g, '><');
  }

  if (removeLineBreaks.checked) {
    result = result.replace(/[\n\r]/g, '');
  }

  return result.trim();
}

// CSS Minifier
function minifyCSS(code) {
  let result = code;

  if (removeComments.checked) {
    if (preserveImportant.checked) {
      const important = result.match(/\/\*![\s\S]*?\*\//g) || [];
      result = result.replace(/\/\*[\s\S]*?\*\//g, '');
      result = important.join('') + result;
    } else {
      result = result.replace(/\/\*[\s\S]*?\*\//g, '');
    }
  }

  if (removeWhitespace.checked) {
    result = result.replace(/\s*([{}:;,])\s*/g, '$1');
  }

  if (optimizeSelectors.checked) {
    result = result.replace(/\s*([>+~])\s*/g, '$1');
  }

  if (removeLineBreaks.checked) {
    result = result.replace(/[\n\r]/g, '');
  }

  return result.trim();
}

// JavaScript Minifier
function minifyJS(code) {
  let result = code;

  if (removeComments.checked) {
    result = result.replace(/\/\/.*$/gm, '');
    if (preserveImportant.checked) {
      const important = result.match(/\/\*![\s\S]*?\*\//g) || [];
      result = result.replace(/\/\*[\s\S]*?\*\//g, '');
      result = important.join('') + result;
    } else {
      result = result.replace(/\/\*[\s\S]*?\*\//g, '');
    }
  }

  if (removeWhitespace.checked) {
    result = result.replace(/\s+/g, ' ');
  }

  if (removeLineBreaks.checked) {
    result = result.replace(/[\n\r]/g, ' ');
  }

  return result.trim();
}

// Download Fix
function downloadFile() {
  const text = outputCode.value;
  if (!text.trim()) return;

  const ext = currentLanguage === 'js' ? 'js' : currentLanguage;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `minified.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

</script>
