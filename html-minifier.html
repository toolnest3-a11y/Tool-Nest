
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Code Minifier | Minify HTML, CSS, JavaScript Online</title>

  <meta name="description" content="Free Code Minifier Online to compress HTML, CSS, and JavaScript files. Reduce file size, improve website speed, and optimize performance instantly." />
  <meta name="keywords" content="code minifier online, html minifier, css minifier, javascript minifier, free code minifier" />
  <meta name="author" content="Tool Nest" />

  <link rel="icon" href="favicon-16x16.png" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fa;
    }

    .wrapper {
      max-width: 1300px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #4361ee, #7209b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      color: #666;
      margin-top: 6px;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      padding: 15px;
      border-radius: 8px;
      border: 2px solid #ddd;
      font-family: JetBrains Mono, monospace;
      font-size: 14px;
    }

    textarea:focus {
      outline: none;
      border-color: #4361ee;
    }

    .count {
      font-size: 12px;
      color: #666;
    }

    .controls {
      margin-top: 15px;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .lang-btn {
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .lang-btn.active {
      background: #4361ee;
      color: #fff;
      border-color: #4361ee;
    }

    .options label {
      display: block;
      margin-bottom: 8px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, #4361ee, #7209b7);
      color: #fff;
    }

    .secondary {
      background: #e9ecef;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-top: 15px;
      text-align: center;
    }

    .stat {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #38b000;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      display: none;
    }

    .notification.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <div class="logo">Code Minifier</div>
    <div class="tagline">Fast & Safe HTML, CSS, JS Minification</div>
  </div>

  <div class="container">
    <div class="layout">

      <!-- INPUT -->
      <div class="section">
        <div class="section-header">
          <span>Input Code</span>
          <span class="count" id="inputCount">0 chars</span>
        </div>

        <textarea id="input"></textarea>

        <div class="controls">
          <div class="languages">
            <button class="lang-btn active" onclick="setLang('html')">HTML</button>
            <button class="lang-btn" onclick="setLang('css')">CSS</button>
            <button class="lang-btn" onclick="setLang('js')">JS</button>
          </div>

          <div class="options">
            <label><input type="checkbox" id="ws" checked /> Remove whitespace</label>
            <label><input type="checkbox" id="cm" checked /> Remove comments</label>
          </div>

          <div class="actions">
            <button class="primary" onclick="minify()">Minify</button>
            <button class="secondary" onclick="clearAll()">Clear</button>
          </div>
        </div>
      </div>

      <!-- OUTPUT -->
      <div class="section">
        <div class="section-header">
          <span>Minified Output</span>
          <span class="count" id="outputCount">0 chars</span>
        </div>

        <textarea id="output" readonly></textarea>

        <div class="stats">
          <div class="stat"><b id="os">0 B</b><br>Original</div>
          <div class="stat"><b id="ms">0 B</b><br>Minified</div>
          <div class="stat"><b id="rd">0%</b><br>Saved</div>
          <div class="stat"><b id="tm">0ms</b><br>Time</div>
        </div>

        <div class="actions">
          <button class="secondary" onclick="copy()">Copy</button>
          <button class="secondary" onclick="download()">Download</button>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <strong>Tool Nest</strong><br>
    Free developer tools — 100% browser-based & private
  </footer>
</div>

<div class="notification" id="note">Done</div>

<script>
  let lang = "html";

  function setLang(l) {
    lang = l;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
  }

  function size(bytes) {
    return bytes < 1024 ? bytes+" B" :
           bytes < 1048576 ? (bytes/1024).toFixed(1)+" KB" :
           (bytes/1048576).toFixed(1)+" MB";
  }

  function notify(msg) {
    const n = document.getElementById("note");
    n.textContent = msg;
    n.classList.add("show");
    setTimeout(() => n.classList.remove("show"), 2000);
  }

  function minify() {
    const start = performance.now();
    let code = input.value;
    if (!code.trim()) return notify("Enter code");

    let out = code;

    if (document.getElementById("cm").checked) {
      if (lang === "html") out = out.replace(/<!--[\s\S]*?-->/g, "");
      if (lang === "css") out = out.replace(/\/\*[\s\S]*?\*\//g, "");
      if (lang === "js") out = out.replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|\s)\/\/.*$/gm, "");
    }

    if (document.getElementById("ws").checked) {
      out = out.replace(/\s+/g, " ").replace(/>\s+</g, "><");
    }

    output.value = out.trim();

    const o = new Blob([code]).size;
    const m = new Blob([out]).size;

    os.textContent = size(o);
    ms.textContent = size(m);
    rd.textContent = o ? (((o-m)/o)*100).toFixed(1)+"%" : "0%";
    tm.textContent = Math.round(performance.now()-start)+"ms";

    updateCounts();
    notify("Minified!");
  }

  function updateCounts() {
    inputCount.textContent = input.value.length+" chars";
    outputCount.textContent = output.value.length+" chars";
  }

  function copy() {
    navigator.clipboard.writeText(output.value);
    notify("Copied");
  }

  function download() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([output.value]));
    a.download = "minified."+lang;
    a.click();
  }

  function clearAll() {
    input.value = "";
    output.value = "";
    updateCounts();
    notify("Cleared");
  }

  input.addEventListener("input", updateCounts);
</script>

</body>
</html>
